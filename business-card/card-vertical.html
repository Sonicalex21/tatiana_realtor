<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Цифровая визитка — Васильева Татьяна (Вертикальная 1080x1350)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .card-vertical {
      position: relative;
      width: 1080px;
      height: 1350px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Ambient background gradient & architectural grid */
    .bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 60%, #edf2f9 100%);
      z-index: 1;
    }

    /* Subtle geometric background pattern */
    .bg-decor-top {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(235, 90, 20, 0.08) 0%, rgba(24, 62, 135, 0.02) 70%, transparent 100%);
      z-index: 2;
    }

    /* Top Header Bar */
    .top-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 50px 70px 20px 70px;
    }

    .logo-box {
      width: 250px;
    }

    .logo-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .city-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #edf2fa;
      color: #12367d;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid rgba(18, 54, 125, 0.12);
    }

    .city-badge svg {
      width: 18px;
      height: 18px;
      fill: #eb5a14;
    }

    /* Portrait Hero Zone */
    .portrait-section {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .portrait-frame {
      position: relative;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      padding: 10px;
      background: linear-gradient(135deg, #eb5a14 0%, #ffffff 40%, #12367d 100%);
      box-shadow: 0 18px 40px rgba(18, 54, 125, 0.18);
    }

    .portrait-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #eef2f7 url('../assets/images/building_bg.jpg') center/cover no-repeat;
      position: relative;
    }

    .portrait-inner img {
      width: 135%;
      height: 135%;
      object-fit: cover;
      object-position: 48% 18%;
      margin-left: -18%;
      margin-top: -12%;
    }

    /* Info Content Area */
    .content-section {
      position: relative;
      z-index: 10;
      padding: 0 70px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .person-name {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.12;
      color: #12367d;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .person-title {
      font-size: 24px;
      font-weight: 700;
      color: #12367d;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .divider-orange {
      width: 220px;
      height: 4px;
      background: #eb5a14;
      border-radius: 2px;
      margin-bottom: 24px;
    }

    .positioning-tag {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #ffffff;
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 6px 18px rgba(18, 54, 125, 0.08);
      border: 1px solid rgba(18, 54, 125, 0.08);
      margin-bottom: 24px;
    }

    .positioning-tag svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .positioning-tag span {
      font-size: 24px;
      font-weight: 700;
      color: #12367d;
    }

    .quote-card {
      background: #ffffff;
      border-left: 5px solid #eb5a14;
      border-radius: 0 16px 16px 0;
      padding: 18px 24px;
      box-shadow: 0 6px 20px rgba(18, 54, 125, 0.06);
      max-width: 900px;
      text-align: left;
      margin-bottom: 30px;
    }

    .quote-card p {
      font-size: 21.5px;
      line-height: 1.48;
      font-weight: 500;
      color: #233b68;
    }

    /* Actions Section */
    .actions-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .phone-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      max-width: 680px;
      height: 82px;
      background: linear-gradient(135deg, #f56e1b 0%, #eb5a14 60%, #dc4d0a 100%);
      border-radius: 45px;
      color: #ffffff;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(235, 90, 20, 0.35);
      text-decoration: none;
    }

    .phone-icon-round {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-icon-round svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .social-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #0e2b66;
      border-radius: 40px;
      padding: 12px 42px;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(14, 43, 102, 0.3);
    }

    .social-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .social-item svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .social-sep {
      width: 1.5px;
      height: 24px;
      background: rgba(255, 255, 255, 0.35);
    }

    /* Bottom Decorative Wave Ribbon */
    .bottom-wave-bar {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 110px;
      background: linear-gradient(135deg, #0c275e 0%, #12367d 60%, #0a1f49 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 70px;
      box-shadow: 0 -6px 20px rgba(18, 54, 125, 0.15);
    }

    .bottom-wave-bar::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #eb5a14 0%, #f57a2c 50%, #eb5a14 100%);
    }

    .slogan-handwritten {
      font-family: 'Marck Script', cursive;
      font-size: 42px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .website-link-pill {
      font-size: 19px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.12);
      padding: 8px 20px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card-vertical">
    <div class="bg-canvas"></div>
    <div class="bg-decor-top"></div>

    <!-- Header -->
    <header class="top-header">
      <div class="logo-box">
        <img src="../assets/images/logo_monolit_clean.png" alt="АН Монолит">
      </div>
      <div class="city-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <span>г. Чебоксары</span>
      </div>
    </header>

    <!-- Portrait Area (hands strictly hidden) -->
    <div class="portrait-section">
      <div class="portrait-frame">
        <div class="portrait-inner">
          <img src="../assets/images/tatyana_scaled.png" alt="Васильева Татьяна">
        </div>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-section">
      <h1 class="person-name">Васильева Татьяна</h1>
      <div class="person-title">ЭКСПЕРТ ПО НЕДВИЖИМОСТИ</div>
      <div class="divider-orange"></div>

      <div class="positioning-tag">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 3L3 13V28C3 28.5523 3.44772 29 4 29H28C28.5523 29 29 28.5523 29 28V13L16 3Z" stroke="#12367d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M23 8.5V5H26V11" stroke="#12367d" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="11" y="16" width="4" height="4" rx="0.5" fill="#eb5a14"/>
          <rect x="17" y="16" width="4" height="4" rx="0.5" fill="#eb5a14"/>
          <rect x="11" y="22" width="4" height="4" rx="0.5" fill="#eb5a14"/>
          <rect x="17" y="22" width="4" height="4" rx="0.5" fill="#eb5a14"/>
        </svg>
        <span>Риелтор с инженерным подходом</span>
      </div>

      <div class="quote-card">
        <p>
          «Проверяю не только документы, но и само жильё: нахожу скрытые дефекты, протечки и проблемы с проводкой до сделки.»
        </p>
      </div>

      <!-- Actions -->
      <div class="actions-section">
        <div class="phone-pill">
          <div class="phone-icon-round">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </div>
          <span>8 965 680 98 98</span>
        </div>

        <div class="social-pill">
          <div class="social-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.06.63 3.98 1.71 5.57L2.4 21.6c-.15.46.26.87.72.72l4.03-1.31C8.74 21.6 10.33 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 13c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
            <span>Макс</span>
          </div>
          <div class="social-sep"></div>
          <div class="social-item">
            <svg viewBox="0 0 24 24"><path d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14c5.6 0 6.93-1.33 6.93-6.93V8.93C22 3.33 20.67 2 15.07 2zm3.38 13.91c-.48.65-1.28.99-1.92.99-.44 0-.82-.16-1.12-.39-.46-.35-.87-.85-1.33-1.4-.33-.4-.68-.82-1.02-.82-.23 0-.37.16-.51.48-.19.45-.37 1.07-.46 1.41-.12.42-.32.65-.63.71-.16.03-.36.05-.59.05-1.42 0-2.88-.93-4.11-2.61-1.57-2.16-2.67-4.9-2.73-5.07-.08-.24-.04-.45.1-.6.13-.15.35-.23.63-.23h1.83c.4 0 .68.18.84.52.4 1.05 1.05 2.5 1.7 3.36.21.28.39.42.54.42.12 0 .2-.09.26-.29.13-.48.2-1.3.2-1.98 0-1.15-.22-1.48-.84-1.62-.22-.05-.33-.19-.33-.35 0-.17.15-.36.42-.47.45-.18 1.15-.25 1.83-.25.96 0 1.25.13 1.48.43.24.31.23.94.23 1.76 0 .58 0 1.15.06 1.42.08.34.22.46.36.46.12 0 .28-.11.49-.37.7-.85 1.4-2.48 1.63-3.37.09-.34.34-.54.72-.54h1.93c.33 0 .58.11.7.3.11.19.1.43-.03.73-.39.88-1.24 2.45-1.78 3.19-.24.33-.3.49-.3.63 0 .12.08.28.25.5.42.54.98 1.15 1.47 1.76.54.67.75 1.1.66 1.42-.09.32-.42.5-.94.5h-.06z"/></svg>
            <span>VK</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Wave Banner -->
    <footer class="bottom-wave-bar">
      <div class="slogan-handwritten">Ваш надёжный риелтор</div>
      <div class="website-link-pill">domain.ru/tatyana-vasileva</div>
    </footer>
  </div>
</body>
</html>
