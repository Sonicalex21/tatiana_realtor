<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Цифровая визитка — Васильева Татьяна (Горизонтальная 1536x1024)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1536px;
      height: 1024px;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .card {
      position: relative;
      width: 1536px;
      height: 1024px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
    }

    /* Background image from reference resized & enhanced */
    .bg-reference {
      position: absolute;
      top: 0;
      left: 0;
      width: 1536px;
      height: 1024px;
      object-fit: cover;
      z-index: 1;
    }

    /* Right overlay to guarantee 100% crisp text, icons and buttons */
    .right-content {
      position: absolute;
      top: 0;
      right: 0;
      width: 820px;
      height: 1024px;
      z-index: 10;
      padding: 110px 80px 60px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Top right decorative accents */
    .top-right-decor {
      position: absolute;
      top: 0;
      right: 0;
      width: 320px;
      height: 220px;
      pointer-events: none;
      z-index: 5;
    }

    .name-block {
      margin-bottom: 8px;
    }

    .name-title {
      font-size: 78px;
      font-weight: 800;
      line-height: 1.08;
      color: #12367d;
      letter-spacing: -0.5px;
    }

    .profession-title {
      font-size: 31px;
      font-weight: 700;
      color: #12367d;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin-top: 14px;
      margin-bottom: 14px;
    }

    .accent-line {
      width: 480px;
      height: 4.5px;
      background: #eb5a14;
      border-radius: 2px;
      margin-bottom: 30px;
    }

    .positioning-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .house-icon-wrapper {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .house-icon-wrapper svg {
      width: 54px;
      height: 54px;
    }

    .positioning-text {
      font-size: 31px;
      font-weight: 700;
      color: #12367d;
      line-height: 1.2;
    }

    .quote-box {
      border-left: 5px solid #eb5a14;
      padding-left: 24px;
      margin-bottom: 40px;
      max-width: 580px;
    }

    .quote-text {
      font-size: 24.5px;
      line-height: 1.44;
      font-weight: 500;
      color: #233b68;
    }

    .phone-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 540px;
      height: 86px;
      background: linear-gradient(135deg, #f56e1b 0%, #eb5a14 60%, #dc4d0a 100%);
      border-radius: 50px;
      color: #ffffff;
      font-size: 41px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(235, 90, 20, 0.35);
      margin-bottom: 24px;
    }

    .phone-icon-circle {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-icon-circle svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .social-bar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #0e2b66;
      border-radius: 40px;
      padding: 14px 34px;
      color: #ffffff;
      width: fit-content;
      margin-left: 80px;
      box-shadow: 0 8px 20px rgba(14, 43, 102, 0.35);
    }

    .social-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .social-item svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .social-divider {
      width: 1.5px;
      height: 24px;
      background: rgba(255, 255, 255, 0.35);
    }

    /* Left crisp logo overlay */
    .logo-container {
      position: absolute;
      top: 50px;
      left: 60px;
      z-index: 15;
      width: 260px;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Clean base image without duplicate text on right -->
    <img src="../assets/images/card_horizontal_clean_bg.jpg" class="bg-reference" alt="Фон">

    <!-- Crisp High-res Logo -->
    <div class="logo-container">
      <img src="../assets/images/logo_monolit_clean.png" alt="АН Монолит">
    </div>

    <!-- Crisp Vector/Text Content Overlay for right side -->
    <div class="right-content">
      <div class="name-block">
        <h1 class="name-title">Васильева<br>Татьяна</h1>
        <div class="profession-title">ЭКСПЕРТ ПО НЕДВИЖИМОСТИ</div>
        <div class="accent-line"></div>
      </div>

      <div class="positioning-row">
        <div class="house-icon-wrapper">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 3L3 13V28C3 28.5523 3.44772 29 4 29H28C28.5523 29 29 28.5523 29 28V13L16 3Z" stroke="#12367d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M23 8.5V5H26V11" stroke="#12367d" stroke-width="2.3" stroke-linecap="round"/>
            <rect x="11" y="16" width="4" height="4" rx="0.5" fill="#eb5a14"/>
            <rect x="17" y="16" width="4" height="4" rx="0.5" fill="#eb5a14"/>
            <rect x="11" y="22" width="4" height="4" rx="0.5" fill="#eb5a14"/>
            <rect x="17" y="22" width="4" height="4" rx="0.5" fill="#eb5a14"/>
          </svg>
        </div>
        <div class="positioning-text">Риелтор с инженерным<br>подходом</div>
      </div>

      <div class="quote-box">
        <p class="quote-text">
          Проверяю не только документы, но и само жильё: нахожу скрытые дефекты, протечки и проблемы с проводкой до сделки.
        </p>
      </div>

      <div class="phone-btn">
        <div class="phone-icon-circle">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <span>8 965 680 98 98</span>
      </div>

      <div class="social-bar">
        <div class="social-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.06.63 3.98 1.71 5.57L2.4 21.6c-.15.46.26.87.72.72l4.03-1.31C8.74 21.6 10.33 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 13c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
          <span>Макс</span>
        </div>
        <div class="social-divider"></div>
        <div class="social-item">
          <svg viewBox="0 0 24 24"><path d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14c5.6 0 6.93-1.33 6.93-6.93V8.93C22 3.33 20.67 2 15.07 2zm3.38 13.91c-.48.65-1.28.99-1.92.99-.44 0-.82-.16-1.12-.39-.46-.35-.87-.85-1.33-1.4-.33-.4-.68-.82-1.02-.82-.23 0-.37.16-.51.48-.19.45-.37 1.07-.46 1.41-.12.42-.32.65-.63.71-.16.03-.36.05-.59.05-1.42 0-2.88-.93-4.11-2.61-1.57-2.16-2.67-4.9-2.73-5.07-.08-.24-.04-.45.1-.6.13-.15.35-.23.63-.23h1.83c.4 0 .68.18.84.52.4 1.05 1.05 2.5 1.7 3.36.21.28.39.42.54.42.12 0 .2-.09.26-.29.13-.48.2-1.3.2-1.98 0-1.15-.22-1.48-.84-1.62-.22-.05-.33-.19-.33-.35 0-.17.15-.36.42-.47.45-.18 1.15-.25 1.83-.25.96 0 1.25.13 1.48.43.24.31.23.94.23 1.76 0 .58 0 1.15.06 1.42.08.34.22.46.36.46.12 0 .28-.11.49-.37.7-.85 1.4-2.48 1.63-3.37.09-.34.34-.54.72-.54h1.93c.33 0 .58.11.7.3.11.19.1.43-.03.73-.39.88-1.24 2.45-1.78 3.19-.24.33-.3.49-.3.63 0 .12.08.28.25.5.42.54.98 1.15 1.47 1.76.54.67.75 1.1.66 1.42-.09.32-.42.5-.94.5h-.06z"/></svg>
          <span>VK</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
